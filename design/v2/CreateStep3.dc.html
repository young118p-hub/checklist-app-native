<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    a { color: #D43F27; } a:hover { color: #B8341F; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF;">
  <div style="display: flex; flex-direction: column;">
    <div style="height: 56px; padding: 0 4px; display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </div>
      <div style="padding-right: 16px; font-size: 14px; font-weight: 500; color: #6F7580;">3 / 3</div>
    </div>
    <div style="margin: 0 20px; height: 4px; border-radius: 2px; background: #F2553D;"></div>

    <div style="padding: 24px 20px 0; display: flex; flex-direction: column;">
      <div style="font-size: 26px; line-height: 36px; font-weight: 700; color: #16181D;">몇 명이 함께 가요?</div>
      <div style="margin-top: 8px; font-size: 15px; line-height: 22px; color: #5B616E;">인원에 맞춰 수량을 계산해 드려요</div>

      <div style="margin-top: 32px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between;">
        <div style="width: 56px; height: 56px; border-radius: 28px; background: #F3F4F6; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg>
        </div>
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <div style="font-size: 56px; line-height: 64px; font-weight: 700; color: #16181D;">4</div>
          <div style="font-size: 22px; line-height: 30px; font-weight: 600; color: #5B616E;">명</div>
        </div>
        <div style="width: 56px; height: 56px; border-radius: 28px; background: #F3F4F6; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
      </div>

      <div style="margin-top: 20px; display: flex; justify-content: center; gap: 8px;">
        <div style="height: 44px; padding: 0 12px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">1명</div>
        <div style="height: 44px; padding: 0 12px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">2명</div>
        <div style="height: 44px; padding: 0 12px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">3명</div>
        <div style="height: 44px; padding: 0 12px; border-radius: 22px; background: #16181D; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #FFFFFF;">4명</div>
        <div style="height: 44px; padding: 0 12px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">6명</div>
        <div style="height: 44px; padding: 0 12px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">8명</div>
      </div>

      <div style="margin-top: 32px; border-radius: 20px; background: #F8F9FA; padding: 20px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 15px; line-height: 22px; font-weight: 600; color: #16181D;">4명 기준으로 늘어난 항목</div>
          <div style="font-size: 14px; color: #5B616E;">6개</div>
        </div>
        <div style="margin-top: 12px; display: flex; flex-direction: column;">
          <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
            <div style="font-size: 15px; color: #16181D;">침낭</div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <div style="font-size: 14px; color: #5B616E;">1개</div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9EA4AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
              <div style="font-size: 15px; font-weight: 700; color: #D43F27;">4개</div>
            </div>
          </div>
          <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
            <div style="font-size: 15px; color: #16181D;">캠핑 의자</div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <div style="font-size: 14px; color: #5B616E;">1개</div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9EA4AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
              <div style="font-size: 15px; font-weight: 700; color: #D43F27;">4개</div>
            </div>
          </div>
          <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
            <div style="font-size: 15px; color: #16181D;">고기/식재료</div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <div style="font-size: 14px; color: #5B616E;">200g</div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9EA4AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
              <div style="font-size: 15px; font-weight: 700; color: #D43F27;">800g</div>
            </div>
          </div>
          <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
            <div style="font-size: 15px; color: #16181D;">물</div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <div style="font-size: 14px; color: #5B616E;">2L</div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9EA4AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
              <div style="font-size: 15px; font-weight: 700; color: #D43F27;">8L</div>
            </div>
          </div>
        </div>
        <div style="margin-top: 12px; font-size: 13px; line-height: 18px; color: #5B616E;">매트/에어매트, 베개도 4개로 늘었고 나머지 20개는 그대로예요</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 20px; background: #FFFFFF;">
    <div style="height: 56px; border-radius: 16px; background: #D43F27; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #FFFFFF;">리스트 만들기</div>
  </div>
</div>
</x-dc>
</body>
</html>
