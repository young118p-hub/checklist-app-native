<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans KR", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    a { color: #D43F27; } a:hover { color: #B8341F; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF;">
  <div style="display: flex; flex-direction: column;">
    <div style="height: 56px; padding: 0 4px; display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </div>
      <div style="padding-right: 16px; font-size: 14px; font-weight: 500; color: #6F7580;">2 / 3</div>
    </div>
    <div style="margin: 0 20px; height: 4px; border-radius: 2px; background: #F3F4F6;">
      <div style="width: 66.6%; height: 4px; border-radius: 2px; background: #F2553D;"></div>
    </div>

    <div style="padding: 24px 20px 0; display: flex; flex-direction: column;">
      <div style="font-size: 26px; line-height: 36px; font-weight: 700; color: #16181D;">언제 떠나세요?</div>
      <div style="margin-top: 8px; font-size: 15px; line-height: 22px; color: #5B616E;">날짜를 정하면 전날 잊지 않게 알려드려요</div>

      <div style="margin-top: 20px; display: flex; gap: 8px;">
        <div style="height: 44px; padding: 0 14px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">오늘</div>
        <div style="height: 44px; padding: 0 14px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">내일</div>
        <div style="height: 44px; padding: 0 14px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">이번 주말</div>
        <div style="height: 44px; padding: 0 14px; border-radius: 22px; background: #F3F4F6; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B616E;">다음 주</div>
      </div>

      <div style="margin-top: 20px; border-radius: 20px; border: 1px solid #E6E8EB; padding: 8px 12px 12px; display: flex; flex-direction: column;">
        <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
          <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9EA4AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          </div>
          <div style="font-size: 16px; font-weight: 600; color: #16181D;">2026년 9월</div>
          <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </div>
        </div>
        <div style="height: 32px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: center; text-align: center; font-size: 13px; color: #6F7580;">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 44px; align-items: center; justify-items: center; font-size: 15px;">
          <div></div><div></div>
          <div style="color: #9EA4AE;">1</div><div style="color: #9EA4AE;">2</div><div style="color: #9EA4AE;">3</div><div style="color: #9EA4AE;">4</div><div style="color: #9EA4AE;">5</div>
          <div style="color: #9EA4AE;">6</div><div style="color: #9EA4AE;">7</div><div style="color: #9EA4AE;">8</div><div style="color: #9EA4AE;">9</div><div style="color: #9EA4AE;">10</div><div style="color: #9EA4AE;">11</div><div style="color: #9EA4AE;">12</div>
          <div style="color: #9EA4AE;">13</div><div style="color: #9EA4AE;">14</div>
          <div style="font-weight: 700; color: #D43F27;">15</div>
          <div style="color: #16181D;">16</div><div style="color: #16181D;">17</div>
          <div style="width: 40px; height: 40px; border-radius: 20px; background: #D43F27; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #FFFFFF;">18</div>
          <div style="color: #16181D;">19</div>
          <div style="color: #16181D;">20</div><div style="color: #16181D;">21</div><div style="color: #16181D;">22</div><div style="color: #16181D;">23</div><div style="color: #16181D;">24</div><div style="color: #16181D;">25</div><div style="color: #16181D;">26</div>
          <div style="color: #16181D;">27</div><div style="color: #16181D;">28</div><div style="color: #16181D;">29</div><div style="color: #16181D;">30</div><div></div><div></div><div></div>
        </div>
      </div>

      <div style="margin-top: 12px; height: 72px; border-radius: 16px; background: #F8F9FA; padding: 0 16px; display: flex; align-items: center; gap: 12px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B616E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 004 0"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 15px; line-height: 22px; font-weight: 600; color: #16181D;">전날 저녁에 알림 받기</div>
          <div style="font-size: 13px; line-height: 18px; color: #5B616E;">9월 17일 (목) 오후 8:00</div>
        </div>
        <div style="width: 48px; height: 28px; border-radius: 14px; background: #F2553D; padding: 3px; box-sizing: border-box; display: flex; justify-content: flex-end;">
          <div style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF;"></div>
        </div>
      </div>

      <div style="margin-top: 8px; height: 48px; padding: 0 16px; align-self: center; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #5B616E;">날짜 없이 만들기</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 20px; background: #FFFFFF;">
    <div style="height: 56px; border-radius: 16px; background: #D43F27; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #FFFFFF;">다음</div>
  </div>
</div>
</x-dc>
</body>
</html>
